# Render's free instance sleeps after ~15 idle minutes, and a webhook that
# arrives while it cold-starts can be lost. A ping every 10 minutes keeps the
# hosted hub awake (one always-on free service fits Render's 750 h/month).
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: github.repository == 'Viratgupta13/sentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://sentinel-us50.onrender.com/healthz
