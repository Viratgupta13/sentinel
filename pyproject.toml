[project]
name = "sentinel-review"
version = "0.1.0"
description = "Context-aware PR risk reviewer with tiered LLM routing (Haiku triage -> Opus deep review)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Virat Gupta" }]
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "PyJWT[crypto]>=2.8",   # GitHub App JWTs (Phase 6 hub)
    "psycopg[binary]>=3.1", # optional Postgres via SENTINEL_DATABASE_URL
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "fastapi>=0.115",   # server tests
    "uvicorn>=0.30",
    "PyJWT[crypto]>=2.8",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API puts Option()/Argument() in parameter defaults.
"src/sentinel/cli.py" = ["B008"]
# The risk map page embeds its browser script; JS lines follow JS width, not PEP 8.
"src/sentinel/report/graph_page.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
